name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build publishable packages
        run: bun run build --filter=@confluxjs/tsconfig --filter=@confluxjs/conflux --filter=@confluxjs/create-conflux

      - name: Publish @confluxjs/tsconfig
        working-directory: packages/tsconfig
        run: npm publish --access public --provenance

      - name: Publish @confluxjs/conflux
        working-directory: packages/conflux
        run: npm publish --access public --provenance

      - name: Publish @confluxjs/create-conflux
        working-directory: packages/create-conflux
        run: npm publish --access public --provenance
